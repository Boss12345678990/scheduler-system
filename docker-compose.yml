services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - '5001:5000'
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/clinic-scheduler
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
